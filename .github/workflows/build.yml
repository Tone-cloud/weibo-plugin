name: Build WeiboPocket Plugin

# NOTE: this file is intentionally ASCII-only.
# Chinese text in inline `run:` blocks is fragile: GitHub writes the block to a
# temp .sh file and bash parses it directly, and a single mangled byte can break
# quoting. (We hit exactly that: a UTF-8/GBK round-trip ate a byte and bash
# reported "unexpected EOF while looking for matching '".)
# Chinese docs live in README.md / docs/SPEC.md; tools/*.py and tools/*.ps1
# print Chinese fine because they are files, not inline shell.

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'qml/**'
      - 'go_server/**'
      - 'tools/**'
      - 'weibo_plugin.pro'
      - 'xmake.lua'
      - 'metadata.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'qml/**'
      - 'go_server/**'
      - 'tools/**'
      - 'weibo_plugin.pro'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 0) Static contract check (fast; catches most mistakes before compiling)
  # ------------------------------------------------------------------
  verify:
    name: Static contract check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tools/verify.py
        run: python3 tools/verify.py

      # Go fallback lint: unused imports / unused locals / undefined calls.
      # The real compile happens in the build-server job.
      - name: Run tools/go_lint.py
        run: python3 tools/go_lint.py

  # ------------------------------------------------------------------
  # 1) Cross-compile libweibo_plugin.so
  #    Same environment as Tone-cloud/netease-music:
  #      qt-5.15.2-for-aarch64-dictpen-linux
  #      aarch64-dictpen-linux-gnu-gcc-toolchain
  #      dictpen-libs
  # ------------------------------------------------------------------
  build-so:
    name: Build libweibo_plugin.so (aarch64)
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Qt 5.15.2 for aarch64
        run: git clone --depth 1 https://github.com/Lyrecoul/qt-5.15.2-for-aarch64-dictpen-linux.git

      - name: Clone GCC toolchain
        run: git clone --depth 1 https://github.com/Lyrecoul/aarch64-dictpen-linux-gnu-gcc-toolchain.git

      - name: Clone dictpen-libs
        run: git clone --depth 1 https://github.com/Lyrecoul/dictpen-libs.git

      - name: Set up environment
        run: |
          echo "$PWD/qt-5.15.2-for-aarch64-dictpen-linux/bin" >> $GITHUB_PATH
          echo "$PWD/aarch64-dictpen-linux-gnu-gcc-toolchain/bin" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          echo "=== workspace ==="
          pwd; ls -d */ | head -20
          echo "=== qmake version ==="
          ./qt-5.15.2-for-aarch64-dictpen-linux/bin/qmake --version
          echo "=== gcc version ==="
          aarch64-dictpen-linux-gnu-g++ --version | head -1
          echo "=== Qt include modules ==="
          ls qt-5.15.2-for-aarch64-dictpen-linux/include/ | head -40
          echo "=== QtQml exists? ==="
          ls -d qt-5.15.2-for-aarch64-dictpen-linux/include/QtQml 2>/dev/null || echo "QtQml NOT FOUND"
          echo "=== QtQuick exists? ==="
          ls -d qt-5.15.2-for-aarch64-dictpen-linux/include/QtQuick 2>/dev/null || echo "QtQuick NOT FOUND"
          echo "=== QtGui exists? ==="
          ls -d qt-5.15.2-for-aarch64-dictpen-linux/include/QtGui 2>/dev/null || echo "QtGui NOT FOUND"
          echo "=== Qt linkable .so symlinks (we link against these) ==="
          ls -l qt-5.15.2-for-aarch64-dictpen-linux/lib/libQt5Qml.so \
                qt-5.15.2-for-aarch64-dictpen-linux/lib/libQt5Quick.so \
                qt-5.15.2-for-aarch64-dictpen-linux/lib/libQt5Gui.so \
                qt-5.15.2-for-aarch64-dictpen-linux/lib/libQt5Network.so \
                qt-5.15.2-for-aarch64-dictpen-linux/lib/libQt5Core.so 2>&1 | head -20
          echo "=== dictpen mkspec ==="
          ls qt-5.15.2-for-aarch64-dictpen-linux/mkspecs/dictpen/ 2>/dev/null || echo "dictpen mkspec NOT FOUND"
          echo "=== dictpen-libs ==="
          ls dictpen-libs/ 2>/dev/null || echo "dictpen-libs EMPTY"
          echo "=== toolchain binutils (nm/strip/strings) ==="
          for t in nm strip strings; do
            command -v aarch64-dictpen-linux-gnu-$t >/dev/null 2>&1 \
              && echo "aarch64-dictpen-linux-gnu-$t: OK" \
              || echo "aarch64-dictpen-linux-gnu-$t: MISSING"
          done

      - name: Build with qmake
        run: |
          echo "=== Running qmake ==="
          ./qt-5.15.2-for-aarch64-dictpen-linux/bin/qmake weibo_plugin.pro 2>&1 | tee qmake.log
          QMAKE_EXIT=${PIPESTATUS[0]}
          echo "=== qmake exit code: $QMAKE_EXIT ==="
          if [ $QMAKE_EXIT -ne 0 ]; then
            echo "=== qmake failed, full log ==="
            cat qmake.log
            exit 1
          fi
          echo "=== qmake done, running make ==="
          make -j$(nproc) 2>&1 | tee make.log
          MAKE_EXIT=${PIPESTATUS[0]}
          echo "=== make exit code: $MAKE_EXIT ==="
          if [ $MAKE_EXIT -ne 0 ]; then
            echo "=== make failed, last 120 lines ==="
            tail -120 make.log
            exit 1
          fi
          echo "=== make done ==="
          ls -lh build/

      # qmake appends a VERSION suffix by default:
      #   build/libweibo_plugin.so -> libweibo_plugin.so.1.0.0
      # The plugin dir needs a plain file, so dereference the symlink first,
      # then strip. The ABI check and the upload both use the real file.
      - name: Dereference version suffix and strip
        run: |
          set -euo pipefail
          echo "=== fresh qmake output ==="
          ls -lh build/
          cp -L build/libweibo_plugin.so build/libweibo_plugin.plain.so
          rm -f build/libweibo_plugin.so build/libweibo_plugin.so.1 \
                build/libweibo_plugin.so.1.0 build/libweibo_plugin.so.1.0.0
          mv build/libweibo_plugin.plain.so build/libweibo_plugin.so
          aarch64-dictpen-linux-gnu-strip --strip-unneeded build/libweibo_plugin.so
          echo "=== after dereference + strip ==="
          ls -lh build/libweibo_plugin.so
          file build/libweibo_plugin.so

      # PenMods looks for these three exported C symbols. If any is missing the
      # plugin installs but silently does nothing, so fail loudly here.
      - name: Verify exported plugin ABI
        run: |
          set -euo pipefail
          SO=build/libweibo_plugin.so
          if [ -L "$SO" ]; then echo "FATAL: $SO is still a symlink"; exit 1; fi
          test -f "$SO"
          echo "=== file ==="; file "$SO"
          echo "=== must be an aarch64 shared object ==="
          file "$SO" | grep -qE 'aarch64|ARM aarch64' || { echo "FATAL: not an aarch64 build"; exit 1; }
          echo "=== exported PenMods entry points ==="
          if command -v aarch64-dictpen-linux-gnu-nm >/dev/null 2>&1; then
            aarch64-dictpen-linux-gnu-nm -D --defined-only "$SO" \
              | tee /tmp/syms.txt \
              | grep -E 'init_plugin|attach_engine|destroy_plugin'
          else
            echo "toolchain nm missing, falling back to strings"
            strings "$SO" | grep -xE 'init_plugin|attach_engine|destroy_plugin' | tee /tmp/syms.txt
          fi
          for sym in init_plugin attach_engine destroy_plugin; do
            grep -q "$sym" /tmp/syms.txt || { echo "FATAL: $sym not exported"; exit 1; }
          done
          echo "=== qml entry present? ==="
          test -f qml/main.qml && echo "qml/main.qml OK"

      - name: Upload libweibo_plugin.so
        uses: actions/upload-artifact@v4
        with:
          name: libweibo_plugin
          path: build/libweibo_plugin.so
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) Build the Go sidecar (server, linux/arm64, fully static)
  # ------------------------------------------------------------------
  build-server:
    name: Build Go sidecar (linux/arm64)
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_server/main/go.sum

      - name: Verify no third-party dependencies
        working-directory: go_server/main
        run: |
          go mod tidy
          if [ -s go.sum ]; then
            echo "go.sum is not empty - third-party deps are not allowed:"; cat go.sum; exit 1
          fi
          go vet ./...

      - name: Build server
        working-directory: go_server/main
        run: |
          # Output goes to the REPO ROOT as "server", matching
          # cc/netease build_server.ps1 + package.ps1 (the device-side
          # executable name inside the plugin dir is fixed to "server").
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o ../../server .
          chmod +x ../../server
          ls -lh ../../server
          file ../../server

      - name: Smoke test (host build + /server/ping)
        working-directory: go_server/main
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go build -o /tmp/server-host .
          PORT=18010 /tmp/server-host > /tmp/server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18010/server/ping > /tmp/ping.json; then break; fi
            sleep 0.25
          done
          echo "--- /server/ping ---"; cat /tmp/ping.json || true
          echo "--- / (endpoint index) ---"; curl -sf http://127.0.0.1:18010/ | head -5 || true
          echo "--- /login/info (offline-safe) ---"; curl -sf http://127.0.0.1:18010/login/info || true
          kill $SRV 2>/dev/null || true
          grep -q '"ok":true' /tmp/ping.json || { echo "ping failed"; cat /tmp/server.log; exit 1; }
          grep -q '"code":0' /tmp/ping.json || { echo "envelope wrong"; cat /tmp/ping.json; exit 1; }

      # End-to-end test of the "paste cookies on the PC, auto-import into the
      # pen" flow. No real device needed: a host build of the sidecar acts as
      # one. Covers the LAN import page (token, form POST, export), the
      # /config/import API (4 body shapes), the cookies.json file watcher,
      # UTF-8 BOM tolerance, and the error branches.
      - name: Auto-import integration test (LAN login page + watcher + BOM)
        working-directory: go_server/main
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=$(go env GOARCH) go build -o ../../server_host .
          cd "$GITHUB_WORKSPACE"
          python3 tools/test_autoimport.py ./server_host

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Package a zip that can be unpacked straight into the plugin dir
  #    (flat layout, same as cc/netease package.ps1)
  # ------------------------------------------------------------------
  package:
    name: Package com.weibopocket.client.zip
    needs: [build-so, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download libweibo_plugin.so
        uses: actions/download-artifact@v4
        with:
          name: libweibo_plugin
          path: build

      - name: Download server
        uses: actions/download-artifact@v4
        with:
          name: server
          path: .

      # metadata.json declares main_so as "libweibo_plugin.so", i.e. the file
      # name at the plugin root. The artifact lands in build/, so move it up
      # before validating (this ordering bug bit us once).
      - name: Stage runtime files
        run: |
          set -euo pipefail
          cp -L build/libweibo_plugin.so ./libweibo_plugin.so
          chmod +x ./libweibo_plugin.so ./server
          ls -lh libweibo_plugin.so server

      - name: Validate layout before zipping
        run: |
          set -euo pipefail
          test -f libweibo_plugin.so   || { echo "missing libweibo_plugin.so"; exit 1; }
          test -f server               || { echo "missing server"; exit 1; }
          test -f qml/main.qml         || { echo "missing qml/main.qml"; exit 1; }
          test -f metadata.json        || { echo "missing metadata.json"; exit 1; }
          test -f icon.png             || { echo "missing icon.png"; exit 1; }
          test -f cookies.example.json || { echo "missing cookies.example.json"; exit 1; }
          echo "=== file types ==="
          file ./libweibo_plugin.so ./server
          file ./libweibo_plugin.so | grep -qE 'aarch64|ARM aarch64' \
            || { echo "FATAL: libweibo_plugin.so is not aarch64"; exit 1; }
          file ./server | grep -qE 'aarch64|ARM aarch64' \
            || { echo "FATAL: server is not aarch64"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          meta = json.load(open('metadata.json', encoding='utf-8'))
          for key in ('main_qml', 'main_so'):
              p = meta[key]
              if not os.path.exists(p):
                  sys.exit(f'metadata.json {key} -> {p} does not exist')
              print(f'OK {key}: {p}')
          print('OK id:', meta['id'])
          PY

      # -j drops path prefixes so the files sit at the zip root, which is what
      # the device expects. The qml/ directory keeps its prefix.
      - name: Create flat zip
        run: |
          set -euo pipefail
          ZIP=com.weibopocket.client.zip
          rm -f "$ZIP"
          zip -j -q "$ZIP" metadata.json server icon.png README.md cookies.example.json libweibo_plugin.so
          zip -r -q "$ZIP" qml
          ls -lh "$ZIP"
          echo "=== zip entries (first 25) ==="
          unzip -l "$ZIP" | head -25
          python3 - "$ZIP" <<'PY'
          import json, sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          meta = json.load(open('metadata.json', encoding='utf-8'))
          for key in ('main_qml', 'main_so'):
              want = meta[key]
              assert want in names, f'zip is missing {key} -> {want}'
              print(f'OK zip {key}: {want}')
          assert 'server' in names, 'zip is missing server'
          assert 'qml/components/Theme.qml' in names, 'zip is missing qml/components/Theme.qml'
          # Entry names must use forward slashes; backslashes extract as literal
          # filename characters on Linux.
          bad = [n for n in names if '\\' in n]
          assert not bad, f'zip has backslash entry names (Linux extraction breaks): {bad[:3]}'
          print(f'OK zip has {len(names)} entries, no backslashes')
          PY

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: com.weibopocket.client-zip
          path: com.weibopocket.client.zip
          if-no-files-found: error
